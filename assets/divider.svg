<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Divider">
  <style>
    .sweep { animation: sweep 4s linear infinite; }
    @keyframes sweep { 0% { transform: translateX(-200px); } 100% { transform: translateX(1220px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { transform: translateX(500px); } }
  </style>
  <rect width="1200" height="24" fill="#050507"/>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#2A2E37" stroke-width="2"/>
  <line x1="300" y1="6" x2="300" y2="18" stroke="#F5F6F8" stroke-width="2"/>
  <line x1="600" y1="6" x2="600" y2="18" stroke="#F5F6F8" stroke-width="2"/>
  <line x1="900" y1="6" x2="900" y2="18" stroke="#F5F6F8" stroke-width="2"/>
  <rect class="sweep" x="0" y="11" width="180" height="2" fill="#FF4655"/>
</svg>
