<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Agent fleet pipeline: intake, plan, parallel worker agents, verify, signoff, ship.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a12"/><stop offset="1" stop-color="#000204"/>
    </linearGradient>
    <linearGradient id="cy2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0d2b3a" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig2" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="g2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="s2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fr2"><rect width="1200" height="340" rx="10"/></clipPath>

    <path id="p1" fill="none" d="M356,170 C424,170 432,64 500,64"/>
    <path id="p2" fill="none" d="M356,170 C424,170 432,134 500,134"/>
    <path id="p3" fill="none" d="M356,170 C424,170 432,206 500,206"/>
    <path id="p4" fill="none" d="M356,170 C424,170 432,276 500,276"/>
    <path id="q1" fill="none" d="M624,64 C692,64 700,170 768,170"/>
    <path id="q2" fill="none" d="M624,134 C692,134 700,170 768,170"/>
    <path id="q3" fill="none" d="M624,206 C692,206 700,170 768,170"/>
    <path id="q4" fill="none" d="M624,276 C692,276 700,170 768,170"/>
    <path id="r1" fill="none" d="M884,170 L952,170"/>
    <path id="r2" fill="none" d="M1068,170 L1132,170"/>
    <path id="i1" fill="none" d="M188,170 L240,170"/>

    <style>
      .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .pulse2{animation:pu2 2.4s ease-in-out infinite}@keyframes pu2{0%,100%{opacity:.45}50%{opacity:1}}
      .node{animation:nd 3.6s ease-in-out infinite}@keyframes nd{0%,100%{opacity:.85}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#fr2)">
    <rect width="1200" height="340" fill="url(#bg2)"/>
    <rect width="1200" height="340" fill="url(#grid2)" opacity="0.4"/>

    <text class="mono" x="40" y="34" font-size="11" letter-spacing="3" fill="#0e7490">AGENT FLEET // EXECUTION LATTICE</text>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#0e7490" opacity="0.4"/>

    <!-- connector paths, drawn with flowing dashes -->
    <g fill="none" stroke="#0e7490" stroke-width="1.4" opacity="0.55" stroke-dasharray="6 10">
      <use xlink:href="#i1"/><use xlink:href="#p1"/><use xlink:href="#p2"/><use xlink:href="#p3"/><use xlink:href="#p4"/>
      <use xlink:href="#q1"/><use xlink:href="#q2"/><use xlink:href="#q3"/><use xlink:href="#q4"/>
      <use xlink:href="#r1"/><use xlink:href="#r2"/>
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.4s" repeatCount="indefinite"/>
    </g>

    <!-- packets -->
    <g filter="url(#s2)">
      <circle r="3.4" fill="#a5f3fc"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#i1"/></animateMotion></circle>
      <circle r="3" fill="#67e8f9"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
      <circle r="3" fill="#67e8f9"><animateMotion dur="2.2s" begin="-.55s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
      <circle r="3" fill="#67e8f9"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
      <circle r="3" fill="#fbbf24"><animateMotion dur="2.2s" begin="-1.65s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
      <circle r="3" fill="#5eead4"><animateMotion dur="2.4s" begin="-.3s" repeatCount="indefinite"><mpath xlink:href="#q1"/></animateMotion></circle>
      <circle r="3" fill="#5eead4"><animateMotion dur="2.4s" begin="-.9s" repeatCount="indefinite"><mpath xlink:href="#q2"/></animateMotion></circle>
      <circle r="3" fill="#5eead4"><animateMotion dur="2.4s" begin="-1.5s" repeatCount="indefinite"><mpath xlink:href="#q3"/></animateMotion></circle>
      <circle r="3" fill="#fbbf24"><animateMotion dur="2.4s" begin="-2.1s" repeatCount="indefinite"><mpath xlink:href="#q4"/></animateMotion></circle>
      <circle r="3.4" fill="#a5f3fc"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath xlink:href="#r1"/></animateMotion></circle>
      <circle r="3.4" fill="#4ade80"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath xlink:href="#r2"/></animateMotion></circle>
    </g>

    <!-- INTAKE -->
    <g class="node">
      <rect x="72" y="146" width="116" height="48" rx="4" fill="#020609" stroke="#0e7490" stroke-width="1.4"/>
      <text class="mono" x="130" y="167" font-size="11" letter-spacing="2" fill="#5eead4" text-anchor="middle">INTAKE</text>
      <text class="mono" x="130" y="182" font-size="8.5" letter-spacing="1.2" fill="#134e4a" text-anchor="middle">scope + gate</text>
    </g>

    <!-- PLAN -->
    <g class="node">
      <rect x="240" y="140" width="116" height="60" rx="4" fill="#022c34" stroke="#22d3ee" stroke-width="1.5" filter="url(#s2)"/>
      <text class="mono" x="298" y="165" font-size="11" letter-spacing="2" fill="#a5f3fc" text-anchor="middle">PLAN</text>
      <text class="mono" x="298" y="181" font-size="8.5" letter-spacing="1.2" fill="#0e7490" text-anchor="middle">acceptance criteria</text>
    </g>

    <!-- WORKER AGENTS -->
    <g class="mono" font-size="10" letter-spacing="1.6">
      <g class="node">
        <polygon points="500,64 512,44 612,44 624,64 612,84 512,84" fill="#020609" stroke="#2dd4bf" stroke-width="1.3"/>
        <text x="562" y="68" fill="#5eead4" text-anchor="middle">AGENT · BUILD</text>
      </g>
      <g class="node" style="animation-delay:.5s">
        <polygon points="500,134 512,114 612,114 624,134 612,154 512,154" fill="#020609" stroke="#2dd4bf" stroke-width="1.3"/>
        <text x="562" y="138" fill="#5eead4" text-anchor="middle">AGENT · TEST</text>
      </g>
      <g class="node" style="animation-delay:1s">
        <polygon points="500,206 512,186 612,186 624,206 612,226 512,226" fill="#020609" stroke="#2dd4bf" stroke-width="1.3"/>
        <text x="562" y="210" fill="#5eead4" text-anchor="middle">AGENT · AUDIT</text>
      </g>
      <g class="node" style="animation-delay:1.5s">
        <polygon points="500,276 512,256 612,256 624,276 612,296 512,296" fill="#1c1408" stroke="#b45309" stroke-width="1.3"/>
        <text x="562" y="280" fill="#fbbf24" text-anchor="middle">AGENT · RESEARCH</text>
      </g>
    </g>
    <text class="mono" x="562" y="318" font-size="8.5" letter-spacing="2" fill="#134e4a" text-anchor="middle">PARALLEL · GIT WORKTREE PER AGENT</text>

    <!-- VERIFY -->
    <g class="node">
      <rect x="768" y="140" width="116" height="60" rx="4" fill="#022c34" stroke="#22d3ee" stroke-width="1.5" filter="url(#s2)"/>
      <text class="mono" x="826" y="165" font-size="11" letter-spacing="2" fill="#a5f3fc" text-anchor="middle">VERIFY</text>
      <text class="mono" x="826" y="181" font-size="8.5" letter-spacing="1.2" fill="#0e7490" text-anchor="middle">adversarial pass</text>
    </g>

    <!-- SIGNOFF -->
    <g class="node">
      <rect x="952" y="146" width="116" height="48" rx="4" fill="#1c1408" stroke="#b45309" stroke-width="1.4"/>
      <text class="mono" x="1010" y="167" font-size="11" letter-spacing="2" fill="#fbbf24" text-anchor="middle">SIGNOFF</text>
      <text class="mono" x="1010" y="182" font-size="8.5" letter-spacing="1.2" fill="#78350f" text-anchor="middle">owner gate</text>
    </g>

    <!-- SHIP -->
    <g>
      <circle cx="1152" cy="170" r="22" fill="#022c1a" stroke="#4ade80" stroke-width="1.5" filter="url(#s2)"/>
      <circle cx="1152" cy="170" r="7" fill="#4ade80" class="pulse2"/>
      <text class="mono" x="1152" y="212" font-size="9.5" letter-spacing="2" fill="#4ade80" text-anchor="middle">SHIP</text>
    </g>

    <!-- feedback loop -->
    <path d="M826,206 C826,300 400,312 298,206" fill="none" stroke="#b45309" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 8"/>
    <text class="mono" x="562" y="334" font-size="8.5" letter-spacing="2" fill="#78350f" text-anchor="middle">FAIL → REPLAN</text>

    <rect width="1200" height="340" fill="url(#vig2)"/>
    <rect x="0.5" y="0.5" width="1199" height="339" rx="10" fill="none" stroke="#155e75"/>
  </g>
</svg>
